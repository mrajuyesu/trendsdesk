def cover_svg(p):
    import random
    r = random.Random(p["slug"])
    a, b, e = COLORS[p["category"]]
    shapes = "".join(f'<circle cx="{r.randint(0, 1200)}" cy="{r.randint(0, 630)}" r="{r.randint(60, 260)}" fill="#fff" opacity="{r.choice([.07, .11, .15])}"/>' for _ in range(7))
    x2, y2 = r.choice([(1, 1), (1, 0), (0, 1)])
    return (f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><defs><linearGradient id="g" x1="0" y1="0" x2="{x2}" y2="{y2}">'
            f'<stop offset="0" stop-color="{a}"/><stop offset="1" stop-color="{b}"/></linearGradient></defs>'
            f'<rect width="1200" height="630" fill="url(#g)"/>{shapes}<text x="600" y="400" font-size="220" text-anchor="middle">{e}</text></svg>')



def esc(s):
    return html.escape(s or "")


def fdate(p):
    try:
        return datetime.date.fromisoformat(p["date"]).strftime("%d %b %Y")
    except Exception:
        return p["date"]


def plink(p):
    return "/" + p["category"] + "/" + p["slug"] + ".html"


def photo(p, big=False):
    im = p.get("image")
    alt = esc(p["title"])
    cover = "/covers/" + p["slug"] + ".svg"
    if not im:
        return '<img src="' + cover + '" alt="' + alt + '" loading="lazy">'
    if big:      # full photo -> smaller thumbnail -> our own illustration if both fail
        fb = " onerror=\"this.onerror=function(){this.src='" + cover + "'};this.src='" + im["thumb"] + "'\""
        src = im["url"]
    else:        # thumbnail -> our own illustration if it fails
        fb = " onerror=\"this.onerror=null;this.src='" + cover + "'\""
        src = im["thumb"]
    return '<img src="' + src + '" alt="' + alt + '" loading="lazy"' + fb + ">"


def kick(p):
    return '<a class="kick" href="/' + p["category"] + '/">' + p["category"] + "</a>"


def meta(p):
    return '<div class="meta">By ' + esc(OWNER) + " · " + fdate(p) + " · " + str(rt(p)) + " min read</div>"


def story_big(p):
    u = plink(p)
    return ('<article class="big"><a class="im" href="' + u + '">' + photo(p, True) + "</a><div>" + kick(p) +
            '<h2><a href="' + u + '">' + esc(p["title"]) + "</a></h2><p>" + esc(p["description"]) + "</p>" + meta(p) + "</div></article>")


def row(p):
    u = plink(p)
    return ('<a class="row" href="' + u + '">' + photo(p) + "<div>" + '<span class="kick">' + p["category"] + "</span><h3>" +
            esc(p["title"]) + "</h3>" + '<div class="meta">' + fdate(p) + "</div></div></a>")


def card(p, big=False):
    u = plink(p)
    return ('<article class="card"><a href="' + u + '">' + photo(p) + "</a>" + kick(p) + '<h3><a href="' + u + '">' +
            esc(p["title"]) + "</a></h3><p>" + esc(p["description"]) + "</p>" + meta(p) + "</article>")


def sidebar(live, skip=None):
    items = [p for p in live if p is not skip][:5]
    chips = "".join('<a class="chip" href="/' + c + '/">' + c.title() + "</a>" for c in CATEGORIES)
    return ('<aside><h4 class="sh">Top headlines</h4>' + "".join(row(p) for p in items) +
            '<h4 class="sh" style="margin-top:30px">Explore</h4><div class="chips">' + chips + "</div></aside>")


def grid(ps):
    if not ps:
        return '<p class="meta">Fresh articles are on the way.</p>'
    return '<div class="grid">' + "".join(card(p) for p in ps) + "</div>"


def write(path, content):
    f = SITE / path
    f.parent.mkdir(parents=True, exist_ok=True)
    if isinstance(content, bytes):
        f.write_bytes(content)
        return
    base = urllib.parse.urlparse(URL).path.rstrip("/")
    if base and str(path).endswith(".html"):
        content = re.sub(r'(href|src|action)="/(?!/)', rf'\1="{base}/', content).replace("fetch('/search.json')", f"fetch('{base}/search.json')").replace("this.src='/covers/", f"this.src='{base}/covers/")
    f.write_text(content, encoding="utf-8")


def info_page(slug, title, desc, inner):
    today = datetime.date.today().strftime("%B %d, %Y")
    body = f'<article class="post"><h1>{title}</h1><p class="meta">Last updated: {today}</p>{inner}</article>'
    write(f"{slug}.html", page(title, body, desc, f"/{slug}.html"))


