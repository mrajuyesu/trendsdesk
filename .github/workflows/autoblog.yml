            '<button type="submit">Send message</button></form>')
    info_page("contact", "Contact us", f"Contact {SITE_NAME} for corrections, questions or feedback.",
              f"<p>Found an error, have a question or want to give feedback? Send us a message and we will reply as soon as we can.</p>{form}")
    write("thanks.html", page("Thank you", '<section class="hero"><h1>Thank you!</h1><p>Your message was sent. We will get back to you soon. <a href="/">Back to home</a></p></section>', path="/thanks.html", noindex=True))


def build():
    live = [p for p in all_posts() if p["status"] == "published"]
    write("style.css", CSS)
    for p in live:
        write("covers/" + p["slug"] + ".svg", cover_svg(p))
    write("favicon.svg", FAVICON)
    for name, (w, h) in {"favicon-32.png": (32, 32), "apple-touch-icon.png": (180, 180), "icon-192.png": (192, 192),
                         "icon-512.png": (512, 512), "og-image.png": (1200, 630)}.items():
        write(name, icon_png(w, h))
    write("site.webmanifest", json.dumps({"name": SITE_NAME, "short_name": SITE_NAME, "start_url": "/", "display": "standalone",
          "background_color": "#fbfaf7", "theme_color": "#b3261e",
          "icons": [{"src": "/icon-192.png", "sizes": "192x192", "type": "image/png"}, {"src": "/icon-512.png", "sizes": "512x512", "type": "image/png"}]}))
    write("_headers", "/*\n  X-Content-Type-Options: nosniff\n  X-Frame-Options: SAMEORIGIN\n  Referrer-Policy: strict-origin-when-cross-origin\n")
    # ---- home page (newspaper front page) ----
    if live:
        home = ('<section class="lead">' + story_big(live[0]) + '<div class="side"><h4 class="sh">Top headlines</h4>' +
                "".join(row(p) for p in live[1:5]) + "</div></section>")
        if live[5:11]:
            home += '<div class="sec"><h2>Latest stories</h2></div>' + grid(live[5:11])
    else:
        home = '<section class="hero"><h1>Fresh articles are on the way.</h1></section>'
    for c in CATEGORIES:
        ps = [p for p in live if p["category"] == c][:3]
        if ps:
            home += '<div class="sec"><h2>' + c + '</h2><a href="/' + c + '/">More ' + c + " →</a></div>" + grid(ps)
    site_ld = json.dumps({"@context": "https://schema.org", "@graph": [
        {"@type": "Organization", "name": SITE_NAME, "url": URL, "logo": URL + "/icon-512.png"},
        {"@type": "WebSite", "name": SITE_NAME, "url": URL, "potentialAction": {"@type": "SearchAction",
         "target": URL + "/search.html?q={search_term_string}", "query-input": "required name=search_term_string"}}]})
    write("index.html", page(SITE_NAME, home, ld='<script type="application/ld+json">' + site_ld + "</script>"))
    for c in CATEGORIES:
        ps = [p for p in live if p["category"] == c]
        write(c + "/index.html", page(c.title(), '<div class="sec"><h2>' + c + '</h2></div><p class="desc">' + esc(CATEGORIES[c]) + "</p><br>" + grid(ps),
                                      c.title() + " news and explainers: " + CATEGORIES[c], "/" + c + "/"))
    # ---- article pages ----
    for p in live:
        u = plink(p)
        im = p.get("image")
        rel = [r for r in live if r["category"] == p["category"] and r is not p][:3]
        rel += [r for r in live if r not in rel and r is not p][:max(0, 3 - len(rel))]
        src = "".join('<li><a href="' + s["url"] + '" rel="noopener nofollow">' + esc(s["title"]) + "</a></li>" for s in p["sources"])
        if im:
            cap = ('Photo: <a href="' + im.get("link", "#") + '" rel="noopener">' + esc(im.get("credit", "Photo")) + "</a>, " +
                   '<a href="' + im.get("license_url", "#") + '" rel="noopener">' + esc(im.get("license", "")) + "</a> via Openverse")
            fig = "<figure>" + photo(p, True) + "<figcaption>" + cap + "</figcaption></figure>"
        else:
            fig = "<figure>" + photo(p, True) + "</figure>"
        full = URL + u
        share = ('<div class="share"><a href="https://wa.me/?text=' + full + '">WhatsApp</a><a href="https://twitter.com/intent/tweet?url=' + full + '">Post on X</a>'
                 "<button onclick=\"navigator.clipboard.writeText(location.href);this.textContent='Copied!'\">Copy link</button></div>")
        art = {"@context": "https://schema.org", "@type": "NewsArticle", "headline": p["title"], "description": p["description"],
               "datePublished": p["date"], "dateModified": p["date"], "image": [im["url"] if im else URL + "/og-image.png"],
               "author": {"@type": "Person", "name": OWNER}, "mainEntityOfPage": full,
               "publisher": {"@type": "Organization", "name": SITE_NAME, "logo": {"@type": "ImageObject", "url": URL + "/icon-512.png"}}}
        crumbs = {"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [
            {"@type": "ListItem", "position": 1, "name": "Home", "item": URL + "/"},
            {"@type": "ListItem", "position": 2, "name": p["category"].title(), "item": URL + "/" + p["category"] + "/"},
            {"@type": "ListItem", "position": 3, "name": p["title"], "item": full}]}
        ld = "".join('<script type="application/ld+json">' + json.dumps(x) + "</script>" for x in (art, crumbs))
        health = '<p class="note">General information only, not medical advice. Talk to a doctor about your own health.</p>' if p["category"] == "health" else ""
        body = ('<div class="cols"><article class="art">' + kick(p) + "<h1>" + esc(p["title"]) + '</h1><p class="deck">' + esc(p["description"]) + "</p>"
                '<div class="by"><span>By <strong>' + esc(OWNER) + "</strong> · " + fdate(p) + " · " + str(rt(p)) + " min read</span><span>" + p["category"].title() + "</span></div>"
                + fig + '<div class="body">' + md(p["body"]) + "</div>"
                + ('<div class="src"><h3>Sources</h3><ul>' + src + "</ul></div>" if src else "") + health + share + "</article>" + sidebar(live, p) + "</div>"
                + '<div class="sec"><h2>More to read</h2></div>' + grid(rel))
        write(u.lstrip("/"), page(p["title"], body, p["description"], u, "article", ld, image=(im["url"] if im else None)))
    # ---- search, info pages, feeds ----
    idx = [{"t": esc(p["title"]), "d": esc(p["description"]), "g": " ".join(p["tags"]), "c": p["category"], "dt": p["date"], "u": plink(p)} for p in live]
    write("search.json", json.dumps(idx))
    js = ("<script>fetch('/search.json').then(r=>r.json()).then(d=>{const q=document.getElementById('q'),r=document.getElementById('r');"
          "function go(){const t=q.value.toLowerCase().trim();r.innerHTML=d.filter(p=>!t||(p.t+' '+p.d+' '+p.g).toLowerCase().includes(t))"
          ".map(p=>`<div class=card2><a href=\"${p.u}\"><b>${p.t}</b></a><div class=meta>${p.c} · ${p.dt}</div><p>${p.d}</p></div>`).join('')||'<p>No results.</p>'}"
          "q.value=new URLSearchParams(location.search).get('q')||'';q.oninput=go;go()})</script>")
    write("search.html", page("Search", '<div class="sec"><h2>Search</h2></div><input id=q placeholder="Search articles…" autofocus><div id=r></div>' + js,
                              path="/search.html", noindex=True))
    build_pages()
    write("404.html", page("Page not found", '<section class="hero"><h1>Page not found</h1><p><a href="/" style="text-decoration:underline">Back to the home page</a></p></section>', noindex=True))
    write("robots.txt", "User-agent: *\nAllow: /\nSitemap: " + URL + "/sitemap.xml\n")
    today = datetime.date.today().isoformat()
    urls = [("/", today)] + [("/" + x + ".html", today) for x in ("about", "contact", "privacy", "terms", "disclaimer")] \
        + [("/" + c + "/", today) for c in CATEGORIES] + [(plink(p), p["date"]) for p in live]
    write("sitemap.xml", '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          + "".join("<url><loc>" + URL + u + "</loc><lastmod>" + d + "</lastmod></url>" for u, d in urls) + "</urlset>")
    items = "".join("<item><title>" + esc(p["title"]) + "</title><link>" + URL + plink(p) + "</link><description>" + esc(p["description"]) + "</description></item>" for p in live[:20])
    write("rss.xml", '<?xml version="1.0"?><rss version="2.0"><channel><title>' + esc(SITE_NAME) + "</title><link>" + URL +
          "</link><description>Latest articles</description>" + items + "</channel></rss>")
    print("built", len(live), "posts ->", SITE)


if __name__ == "__main__":
    cmd = sys.argv[1] if len(sys.argv) > 1 else ""
    if cmd == "run": run()
    elif cmd == "list": [print(f'{p["status"]:9} {p["category"]:14} {p["score"]}/10  {p["slug"]}') for p in all_posts()]
    elif cmd == "approve" and len(sys.argv) > 2: approve(sys.argv[2])
    elif cmd == "check": check()
    elif cmd == "build": build()
    elif cmd == "auto": run(); approve("--good"); build()   # for scheduled/Netlify builds
    else: print(__doc__)
